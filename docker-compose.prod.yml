# IM 项目 — 生产环境 Docker Compose(2C2G 最小栈,7 个服务)
#
# 与开发环境 (docker-compose.yml) 的区别：
#   1. 不对外暴露内部服务端口（MySQL、Redis、MinIO、Gateway）
#   2. 新增 proxy 服务（nginx + SSL 终止）
#   3. 新增 certbot 服务（Let's Encrypt 自动续期）
#   4. 省略 Kafka + Logic：网关直连 MySQL 异步持久化（router.doPersist 双路径），
#      历史/群聊/搜索/未读全部可用；换大服务器可恢复完整形态
#   5. 全部服务带 mem_limit，适配 2GB 内存云服务器
#
# 启动前：先运行 deploy/init-ssl.sh 获取 SSL 证书
# 启动:  docker-compose -f docker-compose.prod.yml up -d
# 停止:  docker-compose -f docker-compose.prod.yml down

services:
  # =========================================================================
  # 数据层（端口仅内网可访问，不映射到宿主机）
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: im-redis
    mem_limit: 128m
    # 不暴露端口到宿主机 —— 仅 Docker 内部网络可访问
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: im-mysql
    # --performance-schema=OFF: 8.4 默认开启,可省 150-300MB 内存
    command: --mysql-native-password=ON --performance-schema=OFF
    mem_limit: 512m
    # 不暴露端口到宿主机
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-im-prod-root}
      MYSQL_DATABASE: im
      MYSQL_USER: im
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-im-prod}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: im-minio
    # GOMEMLIMIT 限制 Go 运行时内存上限,防其抢占 MySQL/Redis 配额
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      GOMEMLIMIT: 256MiB
    mem_limit: 256m
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =========================================================================
  # 连接层
  # =========================================================================

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: im-gateway
    mem_limit: 256m
    # 不暴露端口到宿主机 —— 所有流量经 proxy (nginx) 转发
    # 生产用渲染产物 config.prod.generated.json(deploy/render-config.sh 生成,
    # 首次部署必须先渲染;dev 环境仍用 configs/config.docker.json)
    environment:
      CONFIG_PATH: /etc/im/config.prod.generated.json
    volumes:
      - ./configs:/etc/im
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # 前端（构建 + 静态资源服务）
  # =========================================================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: im-frontend
    mem_limit: 128m
    # 不暴露端口到宿主机 —— proxy 转发
    depends_on:
      - gateway
    restart: unless-stopped

  # =========================================================================
  # SSL 反向代理（对外唯一入口）
  # =========================================================================

  proxy:
    image: nginx:1.27-alpine
    container_name: im-proxy
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.generated.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # =========================================================================
  # Let's Encrypt 证书自动续期
  # =========================================================================

  certbot:
    image: certbot/certbot
    container_name: im-certbot
    mem_limit: 128m
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    # 每 12 小时检查一次证书续期
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

# =========================================================================
# 数据卷
# =========================================================================

volumes:
  redis-data:
  mysql-data:
  minio-data:
