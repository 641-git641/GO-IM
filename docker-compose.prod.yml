# IM 项目 — 生产环境 Docker Compose
#
# 与开发环境 (docker-compose.yml) 的区别：
#   1. 不对外暴露内部服务端口（MySQL、Redis、Kafka、MinIO、Gateway、Logic）
#   2. 新增 proxy 服务（nginx + SSL 终止）
#   3. 新增 certbot 服务（Let's Encrypt 自动续期）
#
# 启动前：先运行 deploy/init-ssl.sh 获取 SSL 证书
# 启动:  docker-compose -f docker-compose.prod.yml up -d
# 停止:  docker-compose -f docker-compose.prod.yml down

services:
  # =========================================================================
  # 数据层（端口仅内网可访问，不映射到宿主机）
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: im-redis
    # 不暴露端口到宿主机 —— 仅 Docker 内部网络可访问
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: im-mysql
    command: --mysql-native-password=ON
    # 不暴露端口到宿主机
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-im-prod-root}
      MYSQL_DATABASE: im
      MYSQL_USER: im
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-im-prod}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: im-kafka
    # 不暴露端口到宿主机
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: im-minio
    # 不暴露端口到宿主机
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =========================================================================
  # 业务层
  # =========================================================================

  logic:
    build:
      context: .
      dockerfile: Dockerfile.logic
    container_name: im-logic
    # 不暴露端口到宿主机
    environment:
      CONFIG_PATH: /etc/im/config.docker.json
    volumes:
      - ./configs:/etc/im
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # 连接层
  # =========================================================================

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: im-gateway
    # 不暴露端口到宿主机 —— 所有流量经 proxy (nginx) 转发
    environment:
      CONFIG_PATH: /etc/im/config.docker.json
    volumes:
      - ./configs:/etc/im
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      logic:
        condition: service_started
    restart: unless-stopped

  # =========================================================================
  # 前端（构建 + 静态资源服务）
  # =========================================================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: im-frontend
    # 不暴露端口到宿主机 —— proxy 转发
    depends_on:
      - gateway
    restart: unless-stopped

  # =========================================================================
  # SSL 反向代理（对外唯一入口）
  # =========================================================================

  proxy:
    image: nginx:1.27-alpine
    container_name: im-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.generated.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # =========================================================================
  # Let's Encrypt 证书自动续期
  # =========================================================================

  certbot:
    image: certbot/certbot
    container_name: im-certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    # 每 12 小时检查一次证书续期
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

# =========================================================================
# 数据卷
# =========================================================================

volumes:
  redis-data:
  mysql-data:
  kafka-data:
  minio-data:
