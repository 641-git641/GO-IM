# IM 项目 — 一键部署（所有服务容器化）
#
# 启动:  docker-compose up -d
# 查看:  docker-compose ps
# 停止:  docker-compose down
# 清理:  docker-compose down -v
#
# 架构:
#   nginx (:80)     → 前端静态资源 + API/WS 反向代理
#   gateway (:8080)  → 连接层 (WebSocket/TCP) + HTTP API
#   logic (:50051)   → 业务层 (gRPC) + Kafka consumer
#   mysql / redis / kafka / minio  → 数据层

services:
  # -----------------------------------------------------------------------
  # 数据层
  # -----------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: im-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: im-mysql
    command: --mysql-native-password=ON
    ports:
      - "3307:3306"   # host:3307 → container:3306（避免与本地 MySQL 冲突）
    environment:
      MYSQL_ROOT_PASSWORD: im-dev-root
      MYSQL_DATABASE: im
      MYSQL_USER: im
      MYSQL_PASSWORD: im-dev
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: im-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: im-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------------------
  # 业务层
  # -----------------------------------------------------------------------

  logic:
    build:
      context: .
      dockerfile: Dockerfile.logic
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: im-logic
    ports:
      - "50051:50051"  # gRPC
    environment:
      CONFIG_PATH: /etc/im/config.docker.json
    volumes:
      - ./configs:/etc/im
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # 连接层
  # -----------------------------------------------------------------------

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: im-gateway
    ports:
      - "8080:8080"   # HTTP / WebSocket
      - "8081:8081"   # gnet TCP
    environment:
      CONFIG_PATH: /etc/im/config.docker.json
    volumes:
      - ./configs:/etc/im
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      logic:
        condition: service_started
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # 前端
  # -----------------------------------------------------------------------

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: im-frontend
    ports:
      - "80:80"        # 浏览器直接访问 http://localhost
    depends_on:
      - gateway
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # 数据卷
  # -----------------------------------------------------------------------

volumes:
  redis-data:
  mysql-data:
  kafka-data:
  minio-data:
