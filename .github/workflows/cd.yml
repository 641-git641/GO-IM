# CD 流水线 —— 自动构建 + 自动部署
#
# 触发:
#   push main(仅当服务相关文件变更) + workflow_dispatch(手动)
#
# 流程:
#   build  构建 gateway/frontend 两个镜像,推送 GHCR(sha-<7> + latest)
#          (最小栈已移除 logic/kafka 服务,不再构建 logic 镜像)
#   deploy 渲染生产配置(secrets 注入)→ git pull + scp 上传 → compose pull + up -d
#          → curl https://$DOMAIN/health 健康检查(重试 180s)
#
# 前置条件(详见 README 部署章节):
#   1. 服务器已 git clone 仓库到 ~/im,并手动执行过 deploy/init-ssl.sh
#   2. 已配置 11 个必配 secrets(SSH_HOST / SSH_USER / SSH_KEY / SSH_PORT / DOMAIN /
#      JWT_SECRET / MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / MINIO_ROOT_USER /
#      MINIO_SECRET_KEY / ADMIN_UID);GHCR_USER / GHCR_TOKEN 可选 —— 镜像公开时
#      匿名拉取即可,配了才执行 docker login(镜像转私有后按需补)
#   3. GRAFANA_CLOUD_URL / GRAFANA_CLOUD_USER / GRAFANA_CLOUD_TOKEN 可选 ——
#      接入 Grafana Cloud 免费版指标采集(见 deploy/alloy.config.alloy);
#      不配则 alloy 容器空转/报错,不影响主栈与健康检查
#
# 回滚: 镜像带 sha-<7> 标签,可在服务器手动
#   TAG=sha-<旧值> docker compose -f docker-compose.prod.yml -f docker-compose.cd.yml up -d

name: CD

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'api/**'
      - 'web/**'
      - 'Dockerfile.gateway'
      - 'Dockerfile.logic'
      - 'Dockerfile.frontend'
      - 'docker-compose.prod.yml'
      - 'docker-compose.cd.yml'
      - 'deploy/**'
      - '.github/workflows/cd.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push · GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN 只对当前仓库的包有写权限;若改用带 packages 的 PAT,
      # 可在仓库 Settings → Secrets 加 GHCR_TOKEN 并在下方覆盖 password。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算短 SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/641-git641/go-im/gateway:sha-${{ steps.sha.outputs.short }}
            ghcr.io/641-git641/go-im/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/641-git641/go-im/frontend:sha-${{ steps.sha.outputs.short }}
            ghcr.io/641-git641/go-im/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy · SSH 部署
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 渲染生产配置(→ configs/config.prod.generated.json)
        run: bash deploy/render-config.sh
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          ADMIN_UID: ${{ secrets.ADMIN_UID }}

      # 先 pull 再 scp: 生成的配置是 gitignore 文件,不会被 git pull 覆盖。
      - name: 服务器拉取最新代码
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/im
            # 服务器到 github.com 国际链路偶发极慢/卡顿,重试 5 次,
            # 每次带 120s 超时 —— 宁可快速失败并给出清晰报错,也不无限挂起
            pulled=0
            for i in $(seq 1 5); do
              if timeout 120 git pull --ff-only; then pulled=1; break; fi
              echo "git pull 失败($i/5),5 秒后重试..."
              sleep 5
            done
            [ "$pulled" = "1" ] || { echo "❌ git pull 连续 5 次失败(服务器到 github.com 网络?),中止部署"; exit 1; }

      - name: 上传渲染配置与 compose override
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "configs/config.prod.generated.json,docker-compose.cd.yml"
          target: "~/im"

      - name: 部署 & 健康检查
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          GRAFANA_CLOUD_URL: ${{ secrets.GRAFANA_CLOUD_URL }}
          GRAFANA_CLOUD_USER: ${{ secrets.GRAFANA_CLOUD_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          TAG: sha-${{ needs.build.outputs.short_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USER,GHCR_TOKEN,MYSQL_ROOT_PASSWORD,MYSQL_PASSWORD,MINIO_ROOT_USER,MINIO_SECRET_KEY,DOMAIN,GRAFANA_CLOUD_URL,GRAFANA_CLOUD_USER,GRAFANA_CLOUD_TOKEN,TAG
          script: |
            set -e
            cd ~/im

            # 镜像公开时匿名拉取即可;若镜像转私有,配 GHCR_USER/GHCR_TOKEN(PAT,
            # 需 read:packages)后此处自动登录
            if [ -n "$GHCR_TOKEN" ] && [ -n "$GHCR_USER" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # 写入 compose 环境变量(gitignore 的 .env,MySQL/MinIO 首次启动时创建凭据,
            # 之后保持不变 —— secrets 值一旦部署即应固定)
            cat > .env <<EOF
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            MYSQL_PASSWORD=$MYSQL_PASSWORD
            MINIO_ROOT_USER=$MINIO_ROOT_USER
            MINIO_ROOT_PASSWORD=$MINIO_SECRET_KEY
            GRAFANA_CLOUD_URL=$GRAFANA_CLOUD_URL
            GRAFANA_CLOUD_USER=$GRAFANA_CLOUD_USER
            GRAFANA_CLOUD_TOKEN=$GRAFANA_CLOUD_TOKEN
            EOF

            # 拉取本次变更的镜像(gateway/frontend/alloy)。服务器到 ghcr.io 的
            # 国际链路偶发极慢/卡顿,逐个带超时;失败不阻塞 —— up 时会用本地
            # 已有镜像,缺的镜像再重试。
            for svc in gateway frontend alloy; do
              timeout 600 docker compose -f docker-compose.prod.yml -f docker-compose.cd.yml pull "$svc" \
                || echo "⚠️ pull $svc 超时/失败,继续"
            done

            docker compose -f docker-compose.prod.yml -f docker-compose.cd.yml up -d --remove-orphans

            # frontend/gateway 重建后容器 IP 变化,proxy(nginx)缓存的旧上游地址
            # 会 502 —— 重启 proxy 重新解析,否则健康检查必失败。
            docker compose -f docker-compose.prod.yml -f docker-compose.cd.yml restart proxy

            echo "等待健康检查(最多 180s)..."
            for i in $(seq 1 30); do
              if curl -fsS "https://$DOMAIN/health" >/dev/null 2>&1; then
                echo "✅ 健康检查通过: https://$DOMAIN/health"
                exit 0
              fi
              sleep 6
            done
            echo "❌ 健康检查超时,当前服务状态:"
            docker compose -f docker-compose.prod.yml -f docker-compose.cd.yml ps
            exit 1
