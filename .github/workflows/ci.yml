# CI 流水线 —— 质量门槛
#
# 六个 job,全部绿色才算通过:
#   lint         gofmt 检查 + go vet + go build
#   unit         单元测试(带 mysql:8.4 service container,自动激活 internal/repo 的 MySQL 测试)
#   integration  集成测试(内存模式,5 个:WebSocket 2 + gnet TCP 3,无需任何服务)
#   kafka        Kafka 端到端(带 apache/kafka service container,跑通 Producer→Consumer→落库)
#   frontend     前端 npm ci + build
#   docker       Docker 镜像构建(只构建不推送,复用 GitHub Actions 缓存)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint · gofmt + vet + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查(非空即失败)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 格式检查:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./internal/... ./cmd/...

      - name: go build
        run: go build ./cmd/gateway/ ./cmd/logic/

  unit:
    name: Unit · 单元测试(带 MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        command: --mysql-native-password=ON
        env:
          MYSQL_ROOT_PASSWORD: im-dev-root
          MYSQL_DATABASE: im
          MYSQL_USER: im
          MYSQL_PASSWORD: im-dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # repo 测试默认 DSN 为 im:im-dev@tcp(127.0.0.1:3306)/im,
      # 与上方 mysql service 的凭据一致,MySQL 可用时自动激活(不再 Skip)。
      - name: go test ./internal/...
        run: go test ./internal/... -count=1

  integration:
    name: Integration · WebSocket + gnet TCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 集成测试用 configs.Default() 内存模式启动 :18080/:18081,无需任何服务容器。
      - name: go test ./cmd/gateway/
        run: go test ./cmd/gateway/ -count=1 -v

  kafka:
    name: Kafka · Producer→Consumer 端到端
    runs-on: ubuntu-latest
    services:
      kafka:
        # 与 docker-compose.prod.yml 相同的 KRaft 单节点配置,
        # 仅 ADVERTISED_LISTENERS 改为 localhost,让 runner 上的测试可直连。
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 跑全部 mq 测试:无 Kafka 时 e2e/集成测试自动跳过;
      # 此处有真实 broker,完整链路(Producer → Kafka → Consumer → 落库)真正跑通。
      - name: go test ./internal/mq/
        run: go test ./internal/mq/ -count=1 -v

  frontend:
    name: Frontend · npm ci + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker · 镜像构建(只构建,不推送)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build gateway 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: false
          tags: ghcr.io/641-git641/go-im/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build logic 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.logic
          push: false
          tags: ghcr.io/641-git641/go-im/logic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ghcr.io/641-git641/go-im/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
