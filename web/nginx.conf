# IM Frontend — nginx reverse proxy + SPA static serving
#
# Static files (/assets/*, /favicon.svg) are served directly.
# API routes are proxied to the Gateway (:8080), including WebSocket upgrade.
# Client-side SPA routes fall through to index.html.

server {
    listen       80;
    server_name  localhost;

    # ------------------------------------------------------------------
    # WebSocket — must come before generic HTTP proxy
    # ------------------------------------------------------------------
    location /ws {
        proxy_pass          http://gateway:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade             $http_upgrade;
        proxy_set_header    Connection          "upgrade";
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # ------------------------------------------------------------------
    # HTTP API routes — proxy to Gateway
    # ------------------------------------------------------------------
    location /login            { proxy_pass http://gateway:8080; }
    location /register         { proxy_pass http://gateway:8080; }
    location /change-password  { proxy_pass http://gateway:8080; }
    location /online           { proxy_pass http://gateway:8080; }
    location /health           { proxy_pass http://gateway:8080; }
    location /upload           { proxy_pass http://gateway:8080; }
    location /file             { proxy_pass http://gateway:8080; }
    location /search           { proxy_pass http://gateway:8080; }
    location /unread           { proxy_pass http://gateway:8080; }

    location /group/           { proxy_pass http://gateway:8080; }
    location /friend/          { proxy_pass http://gateway:8080; }
    location /admin/           { proxy_pass http://gateway:8080; }

    # ------------------------------------------------------------------
    # Static assets (fingerprinted by Vite — long cache is safe)
    # ------------------------------------------------------------------
    location /assets/ {
        root       /usr/share/nginx/html;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
    }

    # ------------------------------------------------------------------
    # SPA fallback — everything else -> index.html
    # ------------------------------------------------------------------
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}
