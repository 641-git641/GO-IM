# IM 前端 —— nginx 反向代理 + SPA 静态资源服务
#
# 静态文件 (/assets/*、/favicon.svg) 直接由 nginx 提供。
# API 路由代理到 Gateway (:8080),包含 WebSocket 升级。
# 客户端 SPA 路由回退到 index.html。

server {
    listen       80;
    server_name  localhost;

    # ------------------------------------------------------------------
    # WebSocket —— 必须放在通用 HTTP 代理之前
    # ------------------------------------------------------------------
    location /ws {
        proxy_pass          http://gateway:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade             $http_upgrade;
        proxy_set_header    Connection          "upgrade";
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # ------------------------------------------------------------------
    # HTTP API 路由 —— 代理到 Gateway
    # ------------------------------------------------------------------
    location /login            { proxy_pass http://gateway:8080; }
    location /register         { proxy_pass http://gateway:8080; }
    location /change-password  { proxy_pass http://gateway:8080; }
    location /online           { proxy_pass http://gateway:8080; }
    location /health           { proxy_pass http://gateway:8080; }
    location /upload           { proxy_pass http://gateway:8080; }
    location /file             { proxy_pass http://gateway:8080; }
    location /search           { proxy_pass http://gateway:8080; }
    location /unread           { proxy_pass http://gateway:8080; }

    location /group/           { proxy_pass http://gateway:8080; }
    location /friend/          { proxy_pass http://gateway:8080; }
    location /admin/           { proxy_pass http://gateway:8080; }

    # ------------------------------------------------------------------
    # SPA 页面路由 —— 精确匹配,在浏览器刷新时提供 index.html。
    # 精确匹配 (=) 优先级最高。非 GET 方法 (POST 等) 通过每个
    # 块内的 limit_except 回退到 API 代理。
    # ------------------------------------------------------------------
    location = /login {
        limit_except GET HEAD { proxy_pass http://gateway:8080; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /register {
        limit_except GET HEAD { proxy_pass http://gateway:8080; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /search {
        limit_except GET HEAD { proxy_pass http://gateway:8080; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /admin {
        limit_except GET HEAD { proxy_pass http://gateway:8080; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ------------------------------------------------------------------
    # 静态资源 (由 Vite 指纹命名 —— 可长期缓存)
    # ------------------------------------------------------------------
    location /assets/ {
        root       /usr/share/nginx/html;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
    }

    # ------------------------------------------------------------------
    # SPA 回退 —— 其余所有请求 -> index.html
    # ------------------------------------------------------------------
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}
