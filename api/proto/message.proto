syntax = "proto3";

package im;
option go_package = "github.com/im/api/proto;proto";

// Message is the single wire-format message for all WebSocket communication.
// The Cmd field discriminates message type (chat, heartbeat, ack, etc.).
message Message {
    int64  seq       = 1;  // client sequence number (for dedup/ack)
    int64  msg_id    = 2;  // server-assigned globally unique ID (snowflake)
    int32  cmd       = 3;  // command discriminator (CmdNone=0, CmdChat=1, ...)
    string from      = 4;  // sender UID (server-set, not trusted from client)
    string to        = 5;  // receiver UID or group ID
    int32  chat_type = 6;  // 1=single, 2=group
    int32  msg_type  = 7;  // 1=text, 2=image, 3=voice, 4=video
    string content   = 8;  // message body
    int64  timestamp = 9;  // unix millisecond timestamp
    bool   need_ack  = 10; // whether client expects ACK
}
